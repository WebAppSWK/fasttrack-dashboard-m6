<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสรุปผลการสอบ Pre-Test ความเป็นเลิศ ม.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-btn.active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
        .filter-btn.active { background-color: #1e293b; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ai-loader { border: 3px solid #e0e7ff; border-top: 3px solid #6366f1; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center z-10">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                <i data-lucide="bar-chart-3" class="w-7 h-7 text-blue-600"></i>
                ระบบสรุปผลการสอบ Pre-Test ความเป็นเลิศ ม.6

            <p class="text-sm text-slate-500 mt-1">ฐานข้อมูลการสอบโครงการ Fast Track - พฤษภาคม 2569</p>
        </div>
        <div id="statusIndicator" class="flex items-center gap-2 text-sm text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200">
            <div class="loader w-4 h-4 border-2"></div> กำลังเริ่มต้นระบบ...
        </div>
    </header>

    <div class="bg-white px-6 py-3 border-b flex items-center gap-4 shadow-sm z-0">
        <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">ตัวกรองข้อมูล:</span>
        <button onclick="setFilter('ALL')" id="flt-ALL" class="filter-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors border shadow-sm hover:bg-slate-50">🌐 ภาพรวมทั้งหมด</button>
        <button onclick="setFilter('SCI')" id="flt-SCI" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors border shadow-sm hover:bg-slate-50 text-slate-600">🔬 สายวิทย์-คณิต</button>
        <button onclick="setFilter('ART')" id="flt-ART" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors border shadow-sm hover:bg-slate-50 text-slate-600">🎨 สายศิลป์</button>
    </div>

    <nav class="bg-white px-6 border-b flex gap-6">
        <button onclick="setTab('overview')" id="tab-btn-overview" class="nav-btn active py-4 px-2 text-slate-600 transition flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> ภาพรวมยุทธศาสตร์</button>
        <button onclick="setTab('subjects')" id="tab-btn-subjects" class="nav-btn py-4 px-2 text-slate-600 transition flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4"></i> ผลสัมฤทธิ์รายวิชา</button>
        <button onclick="setTab('students')" id="tab-btn-students" class="nav-btn py-4 px-2 text-slate-600 transition flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> บัญชีรายชื่อและคะแนน</button>
    </nav>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div id="tab-overview" class="tab-content active space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl p-5 border shadow-sm border-l-4 border-l-blue-500"><span class="text-sm">ผลสัมฤทธิ์ภาพรวม (%)</span><div class="text-3xl font-bold" id="kpi-avg-score">--%</div></div>
                <div class="bg-white rounded-xl p-5 border shadow-sm border-l-4 border-l-emerald-500"><span class="text-sm">จำนวนผู้เข้าสอบ</span><div class="text-3xl font-bold" id="kpi-total-students">--</div></div>
                <div class="bg-white rounded-xl p-5 border shadow-sm border-l-4 border-l-indigo-500"><span class="text-sm">สัดส่วน วิทย์ : ศิลป์</span><div class="text-2xl font-bold" id="kpi-ratio">-- : --</div></div>
                <div class="bg-white rounded-xl p-5 border shadow-sm border-l-4 border-l-rose-500"><span class="text-sm">วิชาที่ควรปรับปรุงด่วน</span><div class="text-xl font-bold" id="kpi-urgent-subject">--</div></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl p-5 border shadow-sm"><canvas id="coreBarChart" class="h-64"></canvas></div>
                <div class="bg-white rounded-xl p-5 border shadow-sm grid grid-cols-2 gap-4"><canvas id="radarSciChart"></canvas><canvas id="radarArtChart"></canvas></div>
            </div>
            <div class="bg-slate-900 rounded-xl p-6 text-white mt-8">
                <h3 class="text-lg font-bold">✨ AI ผู้เชี่ยวชาญด้านความเป็นเลิศทางวิชาการ</h3>
                <div id="ai-response-box" class="bg-slate-800 p-4 rounded-lg hidden mt-4 text-sm" id="ai-content"></div>
                <div class="flex gap-2 mt-4"><input type="text" id="ai-prompt-input" class="flex-1 bg-slate-800 border rounded-lg px-4 py-2" placeholder="พิมพ์ถามยุทธศาสตร์...">
                <button onclick="sendCustomAI()" class="bg-indigo-600 px-6 py-2 rounded-lg">ถาม AI</button></div>
            </div>
        </div>
        <div id="tab-subjects" class="tab-content"><div id="subject-rings-container" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div></div>
        <div id="tab-students" class="tab-content"><div class="bg-white p-4 rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-left" id="studentTableBody"></table></div></div>
    </main>

    <script>
        // ใส่ API Key ที่นี่ (ขึ้นต้นด้วย AIza เท่านั้น)
        const MY_KEY = "AIzaSyCfI_OlBxmlOLTqqqWuwkaKP3GZTLggUso"; 

        let globalData = [];
        let currentFilter = 'ALL';
        let charts = {};

        window.onload = async () => {
            lucide.createIcons();
            await fetchData();
        };

        async function fetchData() {
            // โหลดข้อมูล Demo สำหรับรันในเครื่อง (Fallback)
            const demoSci = `รหัสผู้สอบ,เลขที่,ชื่อ, สกุล,,คณิต,รวมคณิต,ชีวะ,,รวมชีวะ,ฟิสิกส์,,รวมฟิสิกส์,ไทย,สังคม,เคมี,ภาษาอังกฤษ
29141,1,นาย ก,ข,15,0,15,12,7.47,19.47,15,,,40,18,15,53`;
            const demoArt = `รหัสผู้สอบ,เลขที่,ชื่อ, สกุล,คณิต,,รวมคณิต,ภาษาไทย,สังคม,ภาษาอังกฤษ,วิทย์,
29119,1,นาย ข,ค,12,,12,28,32,59,26,11.2`;

            try {
                // พยายามดึง Excel จริง
                const response = await fetch('./สายวิทย์_2.xlsx');
                if(!response.ok) throw new Error();
                // ... (ประมวลผล Excel ที่นี่)
            } catch(e) {
                // ถ้าดึงไม่ได้ใช้ Demo
                const sciStudents = Papa.parse(demoSci, {header: false, skipEmptyLines: true}).data.slice(1);
                // (จำลองข้อมูลให้ครบเพื่อรันหน้าจอ)
                updateDashboard(); 
                document.getElementById('statusIndicator').textContent = "ใช้ข้อมูล Demo";
            }
        }

        async function callAI(prompt) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${MY_KEY}`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        function setFilter(f) { currentFilter = f; updateDashboard(); }
        function setTab(t) { 
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById('tab-' + t).classList.add('active');
        }
        function updateDashboard() { /* อัปเดตกราฟที่นี่ */ }
        function renderTable() { /* อัปเดตตารางที่นี่ */ }
        function sendCustomAI() { /* ส่ง prompt ไปที่ callAI */ }
    </script>
</body>
</html>
